description: 'Catalog for application data produced by the desitnation earth twin engine simulations performed on MareNostrum.'
sources:
  AQUA:
    description: AQUA application data catalog
    driver: yaml_file_cat
    args:
      path: '{{CATALOG_DIR}}/AQUA/AQUA.yaml'
  EnergyOnShore:
    description: EnergyOnShore application data catalog
    driver: yaml_file_cat
    args:
      path: '{{CATALOG_DIR}}/EnergyOnShore/EnergyOnShore.yaml'
  EnergyOffShore:
    description: EnergyOffShore application data catalog
    driver: yaml_file_cat
    args:
      path: '{{CATALOG_DIR}}/EnergyOffShore/EnergyOffShore.yaml'
  FWI:
    description: FWI application data catalog
    driver: yaml_file_cat
    args:
      path: '{{CATALOG_DIR}}/FWI/FWI.yaml'
  HydroMet:
    description: HydroMet application data catalog
    driver: yaml_file_cat
    args:
      path: '{{CATALOG_DIR}}/HydroMet/HydroMet.yaml'
  HydroRiver:
    description: HydroRiver application data catalog
    driver: yaml_file_cat
    args:
      path: '{{CATALOG_DIR}}/HydroRiver/HydroRiver.yaml'
  SPITFIRE:
    description: SPITFIRE application data catalog
    driver: yaml_file_cat
    args:
      path: '{{CATALOG_DIR}}/SPITFIRE/SPITFIRE.yaml'
  Urban:
    description: Urban application data catalog
